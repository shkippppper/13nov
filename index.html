<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nikoloz  Out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/countdown.css">
<link rel="stylesheet" href="css/speech-bubbles.css">
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0" stop-color="#070914"/>
      <stop id="skyBot" offset=".85" stop-color="#1b2342"/>
    </linearGradient>
    <linearGradient id="bandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2028"/><stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop id="moonGlowStop" offset="0" stop-color="#dfe6ff" stop-opacity=".5"/><stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamG" x1="0" y1="1" x2="0" y2="0">
      <stop id="beamStop" offset="0" stop-color="#c9d7ff" stop-opacity=".32"/><stop offset="1" stop-color="#c9d7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fogG">
      <stop id="fogStop" offset="0" stop-color="#7d86a6" stop-opacity=".5"/><stop offset="1" stop-color="#7d86a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolG">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".38"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity=".42"/><stop offset="1" stop-color="#ffe2a0" stop-opacity=".03"/>
    </linearGradient>
    <clipPath id="faceClip"><ellipse cx="0" cy="0" rx="85" ry="119"/></clipPath>
    <image id="faceImg" href="assets/images/hero-face.jpg" x="-137.7" y="-125.8" width="272" height="272"/>
  </defs>

  <!-- ── night sky (fixed to the screen) ── -->
  <g id="skyL">
    <rect width="1920" height="1080" fill="url(#skyG)"/>
    <g id="stars" fill="#ffffff"></g>
    <g id="moon" transform="translate(330 200)">
      <circle r="200" fill="url(#moonGlow)"/>
      <circle id="moonDisc" r="72" fill="#e9edf5"/>
      <g fill="#000" opacity=".13"><circle cx="-22" cy="-18" r="14"/><circle cx="20" cy="10" r="10"/><circle cx="-8" cy="28" r="8"/><circle cx="30" cy="-30" r="6"/><circle cx="-38" cy="12" r="5"/></g>
    </g>
    <g id="beams"></g>
    <g id="clouds"></g>
    <g id="bats" fill="#040306"></g>
    <g id="storm"></g>
    <g id="vultures"></g>
  </g>

  <!-- ── world ── -->
  <g id="world">
    <g id="skyline"></g>
    <g id="tree" fill="none" stroke="#1a120c" stroke-linecap="round">
      <path d="M1700 892 C1704 820 1690 760 1700 660" stroke-width="26"/>
      <path d="M1698 762 Q1652 724 1620 682" stroke-width="13"/>
      <path d="M1620 682 Q1600 652 1588 618" stroke-width="7"/>
      <path d="M1652 716 Q1630 700 1606 706" stroke-width="6"/>
      <path d="M1700 702 Q1752 664 1792 642" stroke-width="12"/>
      <path d="M1792 642 Q1812 612 1832 600" stroke-width="6"/>
      <path d="M1756 668 Q1772 640 1766 612" stroke-width="5"/>
      <path d="M1700 662 Q1688 612 1712 568" stroke-width="9"/>
      <path d="M1712 568 Q1722 548 1716 528" stroke-width="4"/>
    </g>
    <g id="lamp">
      <path id="lampCone" d="M342 632 L190 888 L494 888 Z" fill="url(#coneG)"/>
      <ellipse id="lampPool" cx="342" cy="888" rx="175" ry="20" fill="url(#poolG)"/>
      <path d="M292 892 V652 Q292 620 322 618 H344" stroke="#111117" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M324 612 H362 L354 626 H332 Z" fill="#1b1b22"/>
      <circle id="lampBulb" cx="343" cy="629" r="7" fill="#ffe7a8"/>
    </g>
    <g id="fog"></g>
    <g id="weeds"></g>
    <rect id="dirt" x="-3500" y="890" width="10000" height="3000" fill="#120e0b"/>
    <rect id="grass" x="-3500" y="872" width="10000" height="34" fill="#1c2b20"/>
    <rect id="grassTop" x="-3500" y="866" width="10000" height="10" rx="5" fill="#25382a"/>
    <ellipse id="heroPool" cx="960" cy="888" rx="250" ry="24" fill="url(#poolG)"/>

    <g id="hero">
      <path id="legL" fill="none" stroke="#34466a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="legR" fill="none" stroke="#34466a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="shoeL" rx="25" ry="11" fill="#22252b"/>
      <ellipse id="shoeR" rx="25" ry="11" fill="#22252b"/>
      <g id="body">
        <path d="M900 694 Q960 678 1020 694 L1026 806 Q960 816 894 806 Z" fill="#a9c4da" stroke="#5f7f9c" stroke-width="4" stroke-linejoin="round"/>
        <path d="M933 689 L960 738 L987 689 Z" fill="#f2f2ee"/>
        <path d="M960 738 V808" stroke="#7f9fbb" stroke-width="3"/>
        <circle cx="968" cy="760" r="3.5" fill="#e9eef2"/>
        <circle cx="968" cy="786" r="3.5" fill="#e9eef2"/>
      </g>
      <path id="armLo" fill="none" stroke="#5f7f9c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="armRo" fill="none" stroke="#5f7f9c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="armL" fill="none" stroke="#a9c4da" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="armR" fill="none" stroke="#a9c4da" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="head" transform="translate(960 590)">
        <ellipse rx="91" ry="125" fill="#2b2019"/>
        <use href="#faceImg" xlink:href="#faceImg" clip-path="url(#faceClip)"/>
        <ellipse id="faceTint" rx="85" ry="119" fill="#ff2a10" opacity="0"/>
        <g id="vein" opacity="0" fill="none" stroke="#e3262c" stroke-width="6" stroke-linecap="round">
          <g id="veinS" transform="translate(60 -92)">
            <path d="M-15 -4 Q-6 -6 -4 -15"/><path d="M4 -15 Q6 -6 15 -4"/>
            <path d="M15 4 Q6 6 4 15"/><path d="M-4 15 Q-6 6 -15 4"/>
          </g>
        </g>
      </g>
    </g>

    <g id="tower">
      <g id="plank">
        <rect x="-280" y="-9" width="560" height="18" rx="4" fill="#bf8650" stroke="#6b4423" stroke-width="3"/>
        <path d="M-250 -2 H-130 M-70 3 H80 M140 -3 H255" stroke="#8d5c30" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <g id="drops"></g>

    <g id="hands">
      <circle id="handL" r="17" fill="#eab08b" stroke="#a8714f" stroke-width="4"/>
      <circle id="handR" r="17" fill="#eab08b" stroke="#a8714f" stroke-width="4"/>
    </g>
    <g id="guests"></g>
  </g>

  <!-- storm puffs in front of the tower top -->
  <g id="stormFront" opacity="0"></g>

  <!-- foundation band (countdown sits on top) -->
  <g id="band">
    <rect x="0" y="900" width="1920" height="180" fill="url(#bandG)"/>
    <rect x="0" y="900" width="1920" height="6" fill="#2c303b"/>
    <g id="crackGlow" fill="none" stroke="#ff6a1a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0"></g>
    <g id="cracks" fill="none" stroke="#020203" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></g>
  </g>

  <!-- cxaduri peeking in from a side edge -->
  <g id="peek" style="display:none"></g>

  <!-- io popping up from the bottom edge, near the right corner -->
  <g id="io" style="display:none"></g>

  <g id="ghost" opacity="0">
    <use href="#faceImg" xlink:href="#faceImg" clip-path="url(#faceClip)"/>
  </g>
</svg>
<canvas id="fx" width="1920" height="1080"></canvas>
<div id="vig" class="ov"></div>
<div id="alarm" class="ov"></div>
<div id="sirenL" class="ov"></div>
<div id="sirenR" class="ov"></div>
<div id="say" class="say"></div>
<div id="say2" class="say"></div>
<div id="say3" class="say"></div>
<div id="cd"><i>0</i><i>0</i><b>:</b><i>0</i><i>0</i><b>:</b><i>0</i><i>0</i><b>:</b><i>0</i><i>0</i></div>
<div id="flash" class="ov"></div>
</div>
<!-- load order matters: later files use what earlier ones define. New features go in the features block. -->
<script src="js/core/config.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/time.js"></script>
<script src="js/core/stage-fit.js"></script>
<script src="js/tower/items.js"></script>
<script src="js/tower/tower.js"></script>
<script src="js/scene/sky-city.js"></script>
<script src="js/core/elements.js"></script>
<script src="js/fx/particles.js"></script>
<script src="js/core/state.js"></script>
<script src="js/tower/geometry.js"></script>
<script src="js/tower/falling-junk.js"></script>
<script src="js/hero/foreshadowing.js"></script>
<script src="js/hero/calm.js"></script>
<script src="js/ending/plane.js"></script>
<script src="js/ending/crew.js"></script>
<script src="js/hero/ending.js"></script>
<script src="js/scene/environment.js"></script>
<script src="js/core/speech-bubble.js"></script>
<script src="js/core/features.js"></script>
<!-- features -->
<script src="js/features/couch.js"></script>
<script src="js/features/guests/guests.js"></script>
<script src="js/features/guests/cat.js"></script>
<script src="js/features/cxaduri-peek.js"></script>
<script src="js/features/io.js"></script>
<!-- /features -->
<script src="js/scene/countdown.js"></script>
<script src="js/scene/stage-effects.js"></script>
<script src="js/main.js"></script>
<script src="js/controls.js"></script>
</body>
</html>

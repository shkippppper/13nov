<title>Nikoloz  Out</title>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05050a;cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#070914}
  #scene,#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  .ov{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity}
  #vig{background:radial-gradient(ellipse at 50% 42%,transparent 35%,rgba(0,0,0,.9) 100%)}
  #alarm{background:radial-gradient(ellipse at 50% 42%,transparent 25%,rgba(255,10,0,.95) 110%)}
  #sirenL{background:radial-gradient(ellipse at 0% 62%,rgba(255,25,25,.95),transparent 50%)}
  #sirenR{background:radial-gradient(ellipse at 100% 62%,rgba(40,100,255,.95),transparent 50%)}
  #flash{background:#e8ecff}
  #cd{position:absolute;left:0;top:900px;will-change:opacity;width:1920px;height:180px;display:flex;align-items:center;justify-content:center;
      font:900 128px/1 'Orbitron',ui-monospace,Menlo,Consolas,monospace;color:var(--c,#dfe8ff);
      text-shadow:0 0 14px var(--g,rgba(223,232,255,.7)),0 0 48px var(--g,rgba(223,232,255,.5));user-select:none;
      transform-origin:50% 50%}
  #cd i{display:inline-block;width:.8em;text-align:center;font-style:normal}
  #cd b{display:inline-block;width:.42em;text-align:center;transform:translateY(-.05em)}
  #cd.beat{animation:beat .9s ease-out}
  @keyframes beat{0%{transform:scale(1.13)}100%{transform:scale(1)}}
  #cd.dead{animation:dead 1s steps(1) infinite}
  @keyframes dead{50%{opacity:.2}}
  #say{position:absolute;left:0;top:0;will-change:opacity;padding:10px 28px 14px;background:#fbf6ea;color:#24160e;border:5px solid #24160e;border-radius:40px;
       font:800 46px/1.15 'Noto Sans Georgian',system-ui,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;box-shadow:0 8px 0 rgba(0,0,0,.35)}
  #say::before,#say::after{content:'';position:absolute;left:var(--tx,50%);border-style:solid;border-color:transparent}
  #say::before{bottom:-31px;margin-left:-17px;border-width:26px 17px 0;border-top-color:#24160e}
  #say::after{bottom:-20px;margin-left:-12px;border-width:20px 12px 0;border-top-color:#fbf6ea}
  #say.big{font-size:64px;color:#d81b60}
</style>

  legL.setAttribute('d', `M${f(hl.x)} ${f(hl.y)} L${f(kl.x)} ${f(kl.y)} L${f(fl.x)} ${f(fl.y)}`);

// ───────────────────────── falling things (shared physics; fallen junk piles up)
function pileTop(b) {       // highest resting junk under b, or the ground
  let g = GROUND, sup = null;
  for (const o of DROPS) {
    if (o === b || !o.ground || o.fade < 1 || o.y <= b.y) continue;
    if (b.x + b.hw * 0.75 > o.x - o.hw && b.x - b.hw * 0.75 < o.x + o.hw) { const top = o.y - o.hh; if (top < g) { g = top; sup = o; } }
  }
  return [g, sup];
}
function stepBody(b, dt, xmin, xmax, pile) {
  if (b.ground && b.sup && (b.sup.fade < 1 || !b.sup.ground)) { b.ground = false; b.sup = null; }   // what it rested on is gone
  if (!b.ground) {
    b.vy += 2600 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
    if (b.x < xmin) { b.x = xmin; b.vx = Math.abs(b.vx) * 0.4; }
    if (b.x > xmax) { b.x = xmax; b.vx = -Math.abs(b.vx) * 0.4; }
  } else {
    const tg = Math.round(b.a / 90) * 90 + b.tilt;
    b.a += (tg - b.a) * Math.min(1, dt * 6);
    b.vx *= 1 - Math.min(1, dt * 5); b.x += b.vx * dt;
  }
  const rr = b.a * DEG, sn = Math.abs(Math.sin(rr)), cs = Math.abs(Math.cos(rr));
  b.hh = b.w / 2 * sn + b.h / 2 * cs; b.hw = b.w / 2 * cs + b.h / 2 * sn;
  let hit = 0;
  if (b.ground) b.y = (b.sup ? b.sup.y - b.sup.hh : GROUND) - b.hh;
  else {
    const [g, sup] = pile ? pileTop(b) : [GROUND, null];
    if (b.y + b.hh >= g) {
      b.y = g - b.hh;
      if (b.vy > 250) hit = b.vy;
      b.vy = -b.vy * 0.3; b.vx *= 0.55; b.va *= 0.45;
      if (Math.abs(b.vy) < 70) { b.vy = 0; b.ground = true; b.sup = sup; }
    }
  }
  b.el.setAttribute('transform', `translate(${f(b.x)} ${f(b.y)}) rotate(${b.a.toFixed(2)})`);
  return hit;
}

// Junk falls out of the sky and piles up on both sides of him (the tower itself never loses anything).
function spawnDrop() {
  const type = pick(DROP_TYPES);
  LIVE = false;
  const g = el('g', {}, dropsG), [w, h] = BUILD[type](g, {});
  LIVE = true;
  const left = Math.random() < 0.5;
  const x = left ? rand(330 + w / 2, 800 - w / 2) : rand(1120 + w / 2, 1590 - w / 2);
  const y = -170 - h;
  const b = {
    el: g, type, x, y, a: rand(0, 360), w, h, hw: w / 2, hh: h / 2, vx: rand(-30, 30), vy: rand(250, 450), va: rand(-300, 300),
    ground: false, sup: null, tilt: rand(-15, 15), elec: ELEC.has(type), landed: 0, fade: 1,
    fire: !['duck', 'mug'].includes(type), ignite: 1e9, fs: clamp(Math.sqrt(w * h) / 120, 0.55, 1.3), rate: 6 + w * h / 2000, smoke: 0.8
  };

}
function onDropImpact(b, v) {
  dustBurst(b.x, b.y + b.hh, b.hw, Math.round(12 + b.w / 18));
  if (b.elec) sparkBurst(b.x, b.y, 22);
  for (let i = 0; i < 10 * FX; i++) add({ k: 'crumb', x: b.x + rand(-b.hw, b.hw), y: b.y, vx: rand(-240, 240), vy: rand(-460, -150), c: pick(['#3b4757', '#9aa3b2', '#ffcf33', '#2c3340']), max: 2 });
  shake(Math.min(28, v / 65));

}
function updateDrops(dt) {
  for (const b of DROPS) {
    const hit = stepBody(b, dt, -1400, 3300, true);
    if (hit) onDropImpact(b, hit);
    if (b.ground && !b.landed) b.landed = T || 1e-3;
  }
  // never more than MAX_PILE on the ground: the oldest one crumbles away
  const landed = DROPS.filter(b => b.landed && b.fade >= 1).sort((p, q) => p.landed - q.landed);
  for (let i = 0; i < landed.length - MAX_PILE; i++) { const b = landed[i]; b.fade = 0.999; dustBurst(b.x, b.y, b.hw, 10); }
  for (let i = DROPS.length - 1; i >= 0; i--) {
    const b = DROPS[i];
    if (b.fade >= 1) continue;
    b.fade -= dt / 1.2;
    b.el.setAttribute('opacity', Math.max(0, b.fade).toFixed(2));
    if (b.fade <= 0) { b.el.remove(); DROPS.splice(i, 1); }
  }
}

// ───────────────────────── foreshadowing events (calm phase)
function fireEvent() {
  const r = Math.random(), s = Math.random() < 0.5 ? -1 : 1;
  if (r < 0.18 + D * 0.12) {            // near-topple: the whole thing lurches and he skids to save it
    bendV += s * (35 + 55 * D); angV += s * (30 + 40 * D); slideV += s * (220 + 260 * D);
    dipV += 220; sweatBurst(14); shake(6 + 10 * D); redFlash = 1;
    for (const ph of PHONES) ph.ring = rand(1.5, 2.5);
  } else if (r < 0.45) {                // the tower lurches, he buckles
    angV += s * (22 + 75 * D); bendV += s * (12 + 30 * D);
    dipV += 70 + 140 * D; sweatBurst(3 + D * 9);
    for (const sx of [-260, 260]) for (let i = 0; i < 4 + D * 6; i++) {
      const a = ang * DEG;
      add({ k: 'crumb', x: PIV.x + slide + sx * Math.cos(a), y: PIV.y + curDy + sx * Math.sin(a), vx: rand(-60, 60), vy: rand(-50, 30), c: Math.random() < 0.5 ? '#8d5c30' : '#6b4423', max: 2 });
    }
    shake(2 + 6 * D);
  } else if (r < 0.62) {                // a cable sparks, LEDs go red
    const sw = pick(SWITCHES), [cx, cy] = pick(CABLE_ENDS), p = itemPt(sw, cx, cy);
    sparkBurst(p.x, p.y, Math.round(12 + 30 * D)); redFlash = 0.9; lampOff = 0.4;
  } else if (r < 0.76) {                // the duck slips
    duckV += s * (90 + 160 * D); bendV += rand(-6, 6);
  } else if (r < 0.88) {                // phones start ringing
    for (const ph of PHONES) ph.ring = rand(1.2, 2.2);
  } else {                              // ominous creak + puff of smoke
    const it = pick(ITEMS), p = itemPt(it);
    for (let i = 0; i < 6; i++) add({ k: 'smoke', dark: true, x: p.x + rand(-15, 15), y: p.y - it.h / 2, vx: rand(-20, 20), vy: rand(-80, -40), r: rand(10, 18), g: 26, a: 0.6, max: rand(2, 3) });
    shake(2 + 4 * D); redFlash = 0.5;
  }
  nextEvt = T + lerp(10, 2.6, D) * rand(0.6, 1.4);
}

// ───────────────────────── calm phase: he holds it all up
function updateCalm(dt) {
  const amp = 1.2 + 5 * D;
  const tgt = amp * (0.62 * Math.sin(T * 0.85) + 0.38 * Math.sin(T * 2.2 + 1.3));
  angV += (-26 * (ang - tgt) - 4.2 * angV) * dt; ang = clamp(ang + angV * dt, -16, 16);
  const bAmp = 4 + 14 * D;
  const tgtB = bAmp * (0.65 * Math.sin(T * 0.55 + 0.7) + 0.35 * Math.sin(T * 1.37 + 2.1));
  bendV += (-9 * (bendA - tgtB) - 1.8 * bendV) * dt; bendA = clamp(bendA + bendV * dt, -34, 34);
  dipV += (-70 * dip - 9 * dipV) * dt; dip += dipV * dt;
  slideV += (-28 * slide - 7 * slideV) * dt; slide = clamp(slide + slideV * dt, -90, 90);
  const dy = 2 + 9 * D + 3 * D * Math.sin(T * 2.4) + dip;
  const trem = 0.4 + (D > 0.4 ? (D - 0.4) * 4 : 0);
  tjx = rand(-trem, trem); tjy = rand(-trem, trem) * 0.6; curDy = dy;
  const tx = -ang * 1.6;

  duckV += (-10 * duckX - 2.2 * duckV + (ang + bendA) * 10) * dt; duckX += duckV * dt;
  if (duckX > 60) { duckX = 60; duckV *= -0.4; } if (duckX < -60) { duckX = -60; duckV *= -0.4; }
  poseTower();

  heroG.setAttribute('transform', `translate(${f(slide)} 0)`);
  handsG.setAttribute('transform', `translate(${f(slide)} 0)`);
  heroPool.setAttribute('cx', f(960 + slide));
  const hjx = rand(-1, 1) * (0.3 + D * 1.6), hjy = rand(-1, 1) * (0.2 + D * 1.2);
  bodyG.setAttribute('transform', `translate(${f(tx)} ${f(dy)})`);
  headG.setAttribute('transform', `translate(${f(960 + tx + hjx)} ${f(590 + dy + hjy)}) rotate(${(-ang * 0.4 - slideV * 0.02).toFixed(2)})`);
  const a = ang * DEG, c = Math.cos(a), s = Math.sin(a);
  const hl = { x: PIV.x + tjx - 135 * c - 4 * s, y: PIV.y + dy + tjy - 135 * s + 4 * c };
  const hr = { x: PIV.x + tjx + 135 * c - 4 * s, y: PIV.y + dy + tjy + 135 * s + 4 * c };
  lastHL = hl; lastHR = hr;
  const sl = { x: 905 + tx, y: 712 + dy }, sr = { x: 1015 + tx, y: 712 + dy };
  setArms(sl, { x: sl.x + (hl.x - sl.x) * 0.55 - 34, y: (sl.y + hl.y) / 2 + 6 }, hl,
          sr, { x: sr.x + (hr.x - sr.x) * 0.55 + 34, y: (sr.y + hr.y) / 2 + 6 }, hr);
  const ko = 5 + dy * 0.9, skid = clamp(slideV * 0.05, -14, 14);
  setLegs({ x: 935 + tx * 0.6, y: 800 + dy }, { x: 926 - ko + rand(-1, 1) * D * 2.5, y: 842 + dy * 0.5 }, { x: 920 - skid, y: 879 },
          { x: 985 + tx * 0.6, y: 800 + dy }, { x: 994 + ko + rand(-1, 1) * D * 2.5, y: 842 + dy * 0.5 }, { x: 1000 - skid, y: 879 });
  if (Math.abs(slideV) > 120) emitN(30 * dt, () => add({ k: 'dust', x: 960 + slide + rand(-50, 50), y: GROUND - 4, vx: -slideV * 0.3 + rand(-40, 40), vy: rand(-60, -10), r: rand(10, 18), g: 30, a: 0.6, max: 1 }));

  faceTint.setAttribute('opacity', (0.06 + smooth(0.2, 1, D) * 0.3).toFixed(3));
  vein.setAttribute('opacity', smooth(0.4, 0.6, D).toFixed(3));
  veinS.setAttribute('transform', `translate(60 -92) scale(${(1 + 0.18 * Math.sin(T * 9)).toFixed(3)})`);

  // ambient emitters
  if (D < 0.6) emitN(2.2 * (1 - D) * dt, () => { const p = itemPt(MUG, -2, -28); add({ k: 'smoke', x: p.x + rand(-6, 6), y: p.y, vx: rand(-6, 6), vy: rand(-42, -25), r: 5, g: 11, a: 0.4, max: 2 }); });
  emitN((0.6 + D * 3) * dt, () => sweatBurst(1));
  emitN((0.4 + smooth(0.3, 0.9, D) * 2.5) * dt, () => { const it = Math.random() < 0.5 ? pick(RACKS0) : pick(ITEMS), p = itemPt(it, rand(-it.w / 3, it.w / 3), -it.h / 2); add({ k: 'smoke', dark: true, x: p.x, y: p.y, vx: rand(-10, 10), vy: rand(-70, -40), r: 10, g: 22, a: 0.6, max: 3.5 }); });
  for (const it of HOT) emitN(smooth(0.65, 1, D) * 10 * dt, () => { const p = itemPt(it, rand(-it.w / 2.5, it.w / 2.5), -it.h / 2 + 6); add({ k: 'fire', x: p.x, y: p.y, vx: rand(-15, 15), vy: rand(-140, -80), r: rand(10, 20), max: rand(0.4, 0.7) }); });
  emitN((0.15 + smooth(0.25, 1, D) * 1.3) * dt, () => { const p = itemPt(pick(SWITCHES), ...pick(CABLE_ENDS)); sparkBurst(p.x, p.y, 10); });
  // the pile smoulders, later burns

  if (BUGS.length > nb) BUGS.length = nb;
  for (const b of BUGS) {
    b.r += b.sp * dt; if (b.r >= ROWG.length - 1) { b.r = rand(0.1, 2); b.u = rand(-0.8, 0.8); }
    const row = ROWG[Math.floor(b.r)], fr = b.r - Math.floor(b.r);
    const lx = row.jx + b.u * row.halfW * 0.85 + Math.sin(T * 3 + b.ph) * 4, ly = row.h / 2 - fr * row.h;

    b.wx = row.cx + lx * Math.cos(t) - ly * Math.sin(t); b.wy = row.cy + lx * Math.sin(t) + ly * Math.cos(t); b.wa = t;
  }

  if (rem < 60000) shake((1 - rem / 60000) * 7);
}

// ───────────────────────── collapse + chaos
function startCollapse() {
  state = 'collapse'; cT = 0; bodies = null; impacts = 0; heroX = slide; fanSpd = 1;
  toppleDir = bendA >= 0 ? 1 : -1;
  faceTint.setAttribute('opacity', 0); vein.setAttribute('opacity', 0);
  BUGS.length = 0;
  for (const b of DROPS) b.ignite = rand(0.8, 3);
  shake(6); flashA = Math.max(flashA, 0.3);
  nextGlitch = 7; nextDrop = T + 6;
}

function makeBodies() {
  const mk = (elm, x, y, a, w, h, hf, id) => ({
    el: elm, x, y, a, w, h, hw: w / 2, hh: h / 2,
    vx: toppleDir * hf * rand(250, 850) + (x - 960) * 0.8 + rand(-140, 140), vy: rand(-220, 40), va: rand(-240, 240) * (id === 'plank' ? 0.2 : 1),
    ground: false, hit: false, sup: null, fade: 1, tilt: id === 'plank' ? rand(-3, 3) : rand(-12, 12), elec: ELEC.has(id),
    fire: false, ignite: 1e9, fs: clamp(Math.sqrt(w * h) / 120, 0.55, 1.4), rate: 8 + w * h / 1600, smoke: w * h > 15000 ? 1.6 : 0.6
  });
  const a = ang * DEG;
  bodies = [mk(plankEl, PIV.x + slide + 9 * Math.sin(a), PIV.y + curDy - 9 * Math.cos(a), ang, 560, 18, 0, 'plank')];
  for (const it of ITEMS) {
    const p = itemPt(it), hf = clamp((PIV.y - p.y) / TOWER_H, 0, 1);
    bodies.push(mk(it.el, p.x, p.y, it.row.th + it.a, it.w, it.h, hf, it.type));
  }
  for (const r of ROWG) r.g.setAttribute('transform', '');
  [...bodies].filter(b => b.el !== DUCK.el && b.el !== MUG.el).sort((p, q) => q.w * q.h - p.w * p.h).slice(0, LITE ? 8 : 16).forEach(b => b.fire = true);
}

function onImpact(b, v) {
  impacts++;
  if (!b.hit) { b.hit = true; b.ignite = cT + rand(0.3, 1.8); }
  dustBurst(b.x, b.y + b.hh, b.hw, Math.round(6 + b.w / 30));
  if (b.elec) sparkBurst(b.x, b.y, 14);
  shake(Math.min(28, v / 65));
  if (impacts === 1) flashA = Math.max(flashA, 0.7);
}

function chaosEmit(dt) {
  for (const b of [...bodies, ...DROPS]) {
    if (!b.fire || cT < b.ignite || b.fade < 1) continue;
    emitN(b.rate * 0.55 * dt, () => add({ k: 'fire', x: b.x + rand(-b.hw * 0.7, b.hw * 0.7), y: b.y - b.hh * 0.2 + rand(-b.hh * 0.4, b.hh * 0.3), vx: rand(-25, 25), vy: rand(-170, -90), r: rand(20, 36) * b.fs, max: rand(0.45, 0.9) }));
    emitN(b.smoke * 0.6 * dt, () => add({ k: 'smoke', dark: true, x: b.x + rand(-b.hw * 0.4, b.hw * 0.4), y: b.y - b.hh - 10, vx: rand(-10, 10), vy: rand(-75, -40), r: rand(18, 28), g: rand(18, 30), a: 0.6, max: rand(3, 4) }));
  }
  emitN(12 * dt, () => { const [x, y] = pick(TREE_PTS); add({ k: 'fire', x: x + rand(-14, 14), y: y + rand(-10, 10), vx: rand(-20, 20), vy: rand(-150, -80), r: rand(18, 32), max: rand(0.45, 0.85) }); });
  emitN(0.8 * dt, () => add({ k: 'smoke', dark: true, x: 1700 + rand(-60, 60), y: 560, vx: rand(-10, 10), vy: rand(-70, -40), r: 22, g: 26, a: 0.55, max: 5 }));
  for (const gx of [-300, 230, 520, 1420, 1560, 2150]) emitN(4 * dt, () => add({ k: 'fire', x: gx + rand(-30, 30), y: GROUND - rand(0, 12), vx: rand(-15, 15), vy: rand(-130, -70), r: rand(16, 28), max: rand(0.4, 0.8) }));
  emitN(1 * dt, () => { const b = pick(bodies); if (b.elec) sparkBurst(b.x, b.y, 14); });
}

function updateCollapse(dt) {
  cT += dt;
  // he lets go and dashes off to the right
  const armT = smooth(0, 0.35, cT), walkT = clamp((cT - 0.35) / 1.0, 0, 1);
  heroX = lerp(slide, 1350, walkT * walkT);
  const walking = cT > 0.3, ph = cT * 16;
  const bob = walking ? -Math.abs(Math.sin(ph)) * 6 : 0, sw = walking ? Math.sin(ph) : 0;
  bodyG.setAttribute('transform', `translate(0 ${f(bob)})`);
  headG.setAttribute('transform', `translate(960 ${f(590 + bob)}) rotate(${walking ? 6 : 0})`);
  const sl = { x: 905, y: 712 + bob }, sr = { x: 1015, y: 712 + bob };
  const dl = { x: 878 - sw * 16, y: 800 + bob }, dr = { x: 1042 + sw * 16, y: 800 + bob };
  const hl = { x: lerp(lastHL.x, dl.x, armT), y: lerp(lastHL.y, dl.y, armT) };
  const hr = { x: lerp(lastHR.x, dr.x, armT), y: lerp(lastHR.y, dr.y, armT) };
  setArms(sl, { x: (sl.x + hl.x) / 2 - 22, y: (sl.y + hl.y) / 2 }, hl, sr, { x: (sr.x + hr.x) / 2 + 22, y: (sr.y + hr.y) / 2 }, hr);
  const fl = { x: 920 + sw * 26, y: 879 - (walking ? Math.max(0, Math.cos(ph)) * 14 : 0) };
  const fr = { x: 1000 - sw * 26, y: 879 - (walking ? Math.max(0, -Math.cos(ph)) * 14 : 0) };
  setLegs({ x: 935, y: 800 + bob }, { x: (935 + fl.x) / 2 + 8, y: 842 + bob / 2 }, fl, { x: 985, y: 800 + bob }, { x: (985 + fr.x) / 2 + 8, y: 842 + bob / 2 }, fr);
  heroG.setAttribute('transform', `translate(${f(heroX)} 0)`);
  handsG.setAttribute('transform', `translate(${f(heroX)} 0)`);
  heroPool.setAttribute('opacity', (1 - walkT).toFixed(2));
  if (walking && heroX < 1100) emitN(14 * dt, () => add({ k: 'dust', x: 960 + heroX + rand(-30, 10), y: GROUND - 4, vx: rand(-120, -20), vy: rand(-60, -10), r: rand(10, 18), g: 30, a: 0.6, max: 1 }));
  heroG.style.display = handsG.style.display = heroX > 1150 ? 'none' : '';

  // the tower hangs in the air for a beat (cartoon physics), leans, then comes apart
  if (!bodies) {
    const tr = cT * 3;
    bendA += toppleDir * 30 * dt * (1 + cT * 2);
    ang += rand(-1, 1) * cT * 0.6;
    tjx = rand(-tr, tr); tjy = rand(-tr, tr) * 0.5;
    poseTower();
    if (cT >= 1.2) makeBodies();
  } else {
    for (const b of bodies) { const hit = stepBody(b, dt, -1500, 3400, false); if (hit) onImpact(b, hit); }
  }
  updateDrops(dt);

  fanSpd *= Math.exp(-dt * 0.4);
  if (cT > 2.4) {
    chaosEmit(dt);
    if (cT > nextGlitch) { glitchT = 0.22; ghostT = 1.4; nextGlitch = cT + rand(8, 15); }
    if (T > nextDrop) { spawnDrop(); nextDrop = T + rand(4, 8) * DROP_EVERY; }   // junk keeps raining down
  }
}

function resetCalm() {
  state = 'calm'; bodies = null; cT = 0; heroX = 0;
  heroG.style.display = handsG.style.display = '';
  heroG.setAttribute('transform', ''); handsG.setAttribute('transform', ''); heroPool.setAttribute('opacity', 1);
  for (const it of ITEMS) it.el.setAttribute('transform', it.tf);
  for (const b of DROPS) b.el.remove(); DROPS.length = 0;
  ang = angV = bendA = bendV = dip = dipV = duckX = duckV = slide = slideV = 0; fanSpd = 1;
  P.length = 0; glitchT = ghostT = 0; stage.style.filter = '';
  ghost.setAttribute('opacity', 0);
  cdEl.classList.remove('dead');
  nextDrop = T + 3;
}

// ───────────────────────── environment (night sky, storm, city, gloom, gadgets)
function strike() {
  const left = Math.max(stormX + 150, 40);
  const x0 = rand(left, 1880), y1 = rand(640, 860);
  const main = [[x0 + rand(-80, 80), stormY + 90]];
  let x = main[0][0], y = main[0][1];
  while (y < y1) { y = Math.min(y1, y + rand(22, 55)); x += rand(-36, 36) + (x0 - x) * 0.18; main.push([x, y]); }
  const lines = [main];
  const bi = Math.floor(rand(2, Math.max(3, main.length - 3)));
  if (main[bi]) { let [bx, by] = main[bi]; const br = [[bx, by]], dir = Math.random() < 0.5 ? -1 : 1; for (let i = 0; i < 5; i++) { bx += dir * rand(15, 40); by += rand(15, 40); br.push([bx, by]); } lines.push(br); }
  add({ k: 'bolt', lines, max: 0.32 });
  flashA = Math.max(flashA, rand(0.3, 0.55)); stormFlick = 0.2; shake(3 + 6 * D); lampOff = Math.max(lampOff, 0.25);
}

function updateEnv(dt) {
  const chaos = state !== 'calm', DD = chaos ? 1 : D;
  wind = -(25 + 240 * D);

  put($('skyTop'), 'stop-color', mix3('#070914', '#0d0817', '#0c0204', D));
  put($('skyBot'), 'stop-color', mix3('#1b2342', '#2f1630', '#5e140b', D));

  // stars fade behind the storm, the moon turns blood red
  put(starsG, 'opacity', (1 - smooth(0.2, 0.75, D)).toFixed(2));
  const moonCol = mix('#e9edf5', '#b3241a', smooth(0.2, 0.9, D));
  put($('moonDisc'), 'fill', moonCol);
  put($('moonGlowStop'), 'stop-color', moonCol);
  put($('moon'), 'transform', `translate(330 ${f(200 + smooth(0.6, 1, D) * 60)})`);

  // searchlights sweep the sky
  put($('beamStop'), 'stop-color', mix('#c9d7ff', '#ff5a4a', smooth(0.5, 1, DD)));
  put(beamsG, 'opacity', (0.6 + 0.35 * DD).toFixed(2));
  for (const b of BEAMS) put(b.e, 'transform', `translate(${b.x} ${b.y}) rotate(${f(b.a0 + b.amp * Math.sin(T * b.sp * (1 + DD * 2.2) + b.ph))})`);

  put(cloudsG, 'fill', mix('#262838', '#1a1015', D));
  put(cloudsG, 'opacity', 0.9);
  for (const c of NCLOUDS) {
    c.x -= (10 + 50 * D) * c.v * dt; if (c.x < -250) c.x += 2400;
    put(c.g, 'transform', `translate(${f(c.x)} ${c.y}) scale(${c.s})`);
  }

  for (const b of BATS) {
    b.x += b.v * dt * (1 + D); if (b.x < -80) b.x = 2000; if (b.x > 2000) b.x = -80;
    const fl = Math.sin(T * 16 + b.ph) * 8;
    put(b.e, 'd', `M0 2 Q-8 -4 -14 ${f(-6 + fl)} Q-20 ${f(-4 + fl)} -28 ${f(-8 + fl)} Q-24 ${f(fl * 0.4)} -18 4 Q-12 2 -8 6 Q-4 2 0 6 Q4 2 8 6 Q12 2 18 4 Q24 ${f(fl * 0.4)} 28 ${f(-8 + fl)} Q20 ${f(-4 + fl)} 14 ${f(-6 + fl)} Q8 -4 0 2 Z`);
    put(b.e, 'transform', `translate(${f(b.x)} ${f(b.y + Math.sin(T * 2 + b.ph) * 25 + Math.sin(T * 7 + b.ph) * 6)}) scale(${b.s * (b.v < 0 ? -1 : 1)} ${b.s})`);
  }
  put(vultG, 'opacity', (chaos ? 1 : smooth(0.5, 0.8, D)).toFixed(2));
  if (chaos || D > 0.45) for (const v of VULTS) {
    const a = T * 0.45 + v.ph, x = 960 + Math.cos(a) * 320, y = (chaos ? 320 : 150) + Math.sin(a) * 70;
    const wy = -8 * Math.sin(T * 3 + v.ph) - 4;
    put(v.w, 'd', `M-36 ${f(wy)} Q-18 ${f(wy * 0.4 - 8)} 0 0 Q18 ${f(wy * 0.4 - 8)} 36 ${f(wy)}`);
    put(v.g, 'transform', `translate(${f(x)} ${f(y)}) scale(${Math.sin(a) > 0 ? 1 : -1} 1)`);
  }

  // city: power fails as it gets worse
  put(farG, 'fill', mix('#151b2e', '#0d0a12', D));
  put(nearG, 'fill', mix('#0b0f1c', '#060509', D));
  put(winG, 'fill', mix('#ffd27a', '#ff4a32', smooth(0.4, 1, DD)));
  winT -= dt;
  if (winT <= 0) {
    winT = 1.2;
    for (let i = 0; i < 4; i++) pick(WIN).setAttribute('opacity', Math.random() < 0.15 + DD * 0.6 ? 0.08 : 1);
    for (let i = 0; i < 3; i++) pick(STARS).setAttribute('opacity', f(rand(0.15, 1)));
    put(winPath, 'opacity', (chaos ? 0.12 : lerp(0.8, 0.18, smooth(0.2, 1, D)) * (Math.random() < 0.004 + D * 0.03 ? 0.3 : 1)).toFixed(2));
  }

  // the storm (already here, and spreading)
  stormX = chaos ? 0 : (1 - smooth(0, 0.85, D)) * 900;
  stormY = lerp(-30, 30, D);
  const stT = `translate(${f(stormX)} ${f(stormY)})`;
  put(storm, 'transform', stT); put(stormFront, 'transform', stT);
  stormFlick -= dt;
  const under = stormFlick > 0 ? '#45425f' : mix('#17161e', '#0c090c', D);
  put(stormMain, 'fill', stormFlick > 0 ? '#5a5680' : mix('#201f2a', '#140f14', D));
  put(stormUnder, 'fill', under); put(stormFront, 'fill', under);
  put(stormFront, 'opacity', (chaos ? 0.92 : smooth(0.35, 1, D) * 0.92).toFixed(2));
  if (Math.random() < (chaos ? 1.4 : 0.35 + D * 1.0) * dt) stormFlick = rand(0.06, 0.14);
  if (Math.random() < (chaos ? 0.6 : 0.03 + (D > 0.3 ? (D - 0.3) * 0.9 : 0)) * dt) strike();

  // rain: drizzle now, downpour later
  const rainN = Math.round((chaos ? 260 : 60 + smooth(0.25, 1, D) * 200) * (LITE ? 0.35 : 1));
  while (RAIN.length < rainN) RAIN.push({ x: rand(-100, 2100), y: rand(-50, 900), vx: 0, vy: rand(1300, 1700) });
  if (RAIN.length > rainN) RAIN.length = rainN;
  for (const r of RAIN) {
    r.vx = wind * 1.4 - 80; r.x += r.vx * dt; r.y += r.vy * dt;
    if (r.y > 905 || r.x < -60) { r.x = rand(-100, 2100); r.y = rand(-120, -10); }
  }

  // fog drifting along the ground
  put($('fogStop'), 'stop-color', mix('#7d86a6', '#7a3a30', smooth(0.4, 1, DD)));
  for (const fg of FOGS) {
    fg.x -= fg.v * dt * (1 + D * 3); if (fg.x < -700) fg.x += 2800;
    put(fg.e, 'cx', f(fg.x)); put(fg.e, 'cy', f(fg.y)); put(fg.e, 'rx', f(fg.rx)); put(fg.e, 'ry', f(fg.ry));
  }

  // flickering street lamp
  lampOff -= dt;
  if (Math.random() < (chaos ? 2.5 : 0.25 + D * 2) * dt) lampOff = rand(0.05, chaos ? 1.5 : 0.35);
  const lampA = lampOff > 0 ? (Math.random() < 0.3 ? 0.4 : 0.03) : 1;
  put(lampCone, 'opacity', lampA); put(lampPool, 'opacity', lampA);
  put(lampBulb, 'fill', lampA > 0.5 ? '#ffe7a8' : '#3a3428');
  put(heroPool, 'ry', f(24 + Math.sin(T * 3) * 1.5));

  // dead tree & weeds in the wind
  put($('tree'), 'transform', `rotate(${(Math.sin(T * 1.3) * (0.8 + 3 * D) + Math.sin(T * 3.1) * D * 1.5 - D * 3).toFixed(2)} 1700 888)`);
  WEEDS.forEach(w => put(w.g, 'transform', `rotate(${(Math.sin(T * 2 + w.ph) * (3 + 7 * D) - 4 - D * 12).toFixed(2)} ${f(w.x)} 888)`));
  put($('grass'), 'fill', mix('#1c2b20', '#24190f', D));
  put($('grassTop'), 'fill', mix('#25382a', '#2f2116', D));

  // embers drift up once things start burning
  emitN((chaos ? 14 : smooth(0.45, 1, D) * 9) * dt, () => add({ k: 'ember', x: rand(0, 1920), y: GROUND + 10, vx: rand(-30, 30), vy: rand(-170, -60), r: rand(2.5, 5), ph: rand(0, 6), max: rand(3, 6) }));

  // the foundation cracks
  put($('crackGlow'), 'opacity', (chaos ? 0.55 + 0.25 * Math.sin(T * 4) : smooth(0.75, 1, D) * 0.45).toFixed(2));
  for (const c of CRACKS) {
    const off = (1 - (chaos ? 1 : smooth(c.a, c.b, D))).toFixed(3);
    put(c.p, 'stroke-dashoffset', off); put(c.g, 'stroke-dashoffset', off);
  }

  // gadgets: server lights, terminals, graphs, fans, queues, phones, battery, hourglass
  redFlash -= dt; ledT -= dt; slowT -= dt;
  if (ledT <= 0) {
    ledT = 0.4;
    const pr = chaos ? 0.85 : 0.06 + 0.6 * D * D;
    for (const l of LEDS) {
      let c;
      if (Math.random() < (chaos ? 0.4 : 0.12)) c = '#14301c';
      else if (Math.random() < pr || (redFlash > 0 && Math.random() < 0.7)) c = '#ff3b30';
      else if (Math.random() < 0.05 + D * 0.2) c = '#ffb020';
      else c = '#3dff7a';
      put(l, 'fill', c);
    }
    for (const t of TERM) put(t.e, 'fill', Math.random() < (chaos ? 0.9 : 0.08 + D * 0.7) ? '#ff3b30' : t.c);
  }
  if (slowT <= 0) {
    slowT = 0.35;
    const gc = mix3('#3dff7a', '#ffb020', '#ff3b30', DD);
    for (const g of GRAPHS) { put(g, 'd', graphD(DD)); put(g, 'stroke', gc); }
    for (const hs of SANDS) setSand(hs, DD);
  }
  for (const s of SPIN) { s.a = (s.a + dt * 360 * s.sp * (1.2 + 3 * D) * fanSpd) % 360; put(s.e, 'transform', `translate(${s.x} ${s.y}) rotate(${f(s.a)})`); }
  for (const q of QUEUES) {
    q.off += dt * 70 * (1 - 0.92 * D) * fanSpd;
    q.envs.forEach((e, i) => put(e, 'transform', `translate(${f(((i * 36 + q.off) % 180) - 90)} 0)`));
  }
  if (!chaos && PHONES.length && Math.random() < (0.04 + smooth(0.2, 1, D) * 0.3) * dt) pick(PHONES).ring = rand(1, 2);
  for (const ph of PHONES) {
    ph.ring -= dt;
    const on = ph.ring > 0, blink = (T * 8) % 1 < 0.5;
    put(ph.k, 'transform', on ? `translate(${f(rand(-2.5, 2.5))} 0) rotate(${f(rand(-5, 5))})` : '');
    put(ph.waves, 'opacity', on && blink ? 1 : 0);
    put(ph.sc, 'fill', on ? (blink ? '#ff3b30' : '#ffd0cc') : chaos ? '#14161a' : '#3a7bd5');
  }
  const lvl = chaos ? 0 : clamp(Math.ceil((1 - D) * 4 - 1e-4), 1, 4);
  const bc = lvl >= 3 ? '#3ddc6a' : lvl === 2 ? '#ffb020' : (T * 3) % 1 < 0.5 ? '#ff3b30' : '#ffd0cc';
  UPSB.forEach((b, i) => put(b, 'fill', i < lvl ? bc : '#e8ebf0'));

  // overlays: gloom, alarm, emergency lights
  vigEl.style.opacity = (chaos ? 0.97 : 0.6 + smooth(0.2, 1, D) * 0.35).toFixed(3);
  alarmEl.style.opacity = (chaos ? 0.28 + 0.22 * Math.sin(T * 7) : D > 0.85 ? (D - 0.85) * 2.5 * (0.5 + 0.5 * Math.sin(T * 5)) : 0).toFixed(3);
  const sk = chaos ? 0.55 : smooth(0.6, 1, D) * 0.45, sp = (T * 2.2) % 1 < 0.5;
  sirenL.style.opacity = (sp ? sk : sk * 0.12).toFixed(3); sirenR.style.opacity = (sp ? sk * 0.12 : sk).toFixed(3);
  if (!chaos && D > 0.7 && Math.random() < (D - 0.7) * 0.25 * dt) glitchT = 0.12;

  if (ghostT > 0) {
    ghostT -= dt;
    const g = 1 - ghostT / 1.4;
    put(ghost, 'opacity', (Math.max(0, Math.sin(g * Math.PI)) * 0.34 * (Math.random() < 0.85 ? 1 : 0.35)).toFixed(3));
    put(ghost, 'transform', `translate(${f(960 + rand(-6, 6))} 300) scale(2.3)`);
  } else put(ghost, 'opacity', 0);
}

// ───────────────────────── guests: someone wanders through for 5 min, then nobody for 5 min
// For now the only guest is the cat, with niko.jpg as its head (embedded below, like the hero's face).
const VISIT = [300, 300], AWAY = [300, 300];
const TRAKI_CHANCE = 1 / 3;   // share of cat visits that end with the bubble-butt show
const guestsG = $('guests'), sayEl = $('say');
let clipN = 0;
// head slot: a face photo in a round furry frame; zoom + fx/fy (face center as a fraction of the photo) crop it onto the face
function faceHead(g, { src, zoom = 1, fx = 0.5, fy = 0.5 }, r, fur, line) {
  el('circle', { r: r + 7, fill: fur, stroke: line, 'stroke-width': 4 }, g);
  const id = 'guestClip' + ++clipN;
  el('circle', { r }, el('clipPath', { id }, g));
  const fb = el('g', {}, g);
  for (const s of [-1, 1]) el('ellipse', { cx: s * 18, cy: -8, rx: 6, ry: 9, fill: '#1d1410' }, fb);
  el('path', { d: 'M-7 10H7L0 18Z', fill: '#f29aa0' }, fb);
  el('path', { d: 'M-13 24Q-6 31 0 22Q6 31 13 24', fill: 'none', stroke: '#1d1410', 'stroke-width': 3, 'stroke-linecap': 'round' }, fb);
  const S = r * 2 * zoom;
  const im = el('image', { href: src, x: f(-fx * S), y: f(-fy * S), width: f(S), height: f(S), preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#${id})` }, g);
  const probe = new Image();
  probe.onload = () => fb.remove(); probe.onerror = () => im.remove();
  probe.src = src;
}
// where guests roam (on screen)
const ROAM = [180, 1740];

// speech bubble (an HTML layer above the vignette, so it stays crisp)
let sayT = 0, sayMax = 0, sayW = 0, sayH = 0, sayBy = null;
function say(who, text, dur, big) {
  sayEl.textContent = text; sayEl.classList.toggle('big', !!big);
  sayW = sayEl.offsetWidth; sayH = sayEl.offsetHeight; sayT = sayMax = dur; sayBy = who;
}
function updateSay(dt) {
  if (sayT <= 0) return;
  sayT -= dt;
  const u = clamp((sayMax - sayT) / 0.25, 0, 1) - 1;
  const k = (1 + 2.7 * u * u * u + 1.7 * u * u) * smooth(0, 0.2, sayT);   // pops in with a little overshoot, shrinks away at the end
  const s = sayBy.top();
  const left = clamp(s.x - sayW / 2, 16, 1904 - sayW), tx = clamp(s.x - left, 34, sayW - 34);
  sayEl.style.left = `${f(left)}px`; sayEl.style.top = `${f(s.y - sayH - 26)}px`;
  sayEl.style.setProperty('--tx', `${f(tx)}px`);
  sayEl.style.transformOrigin = `${f(tx)}px ${sayH + 26}px`;
  sayEl.style.transform = `scale(${Math.max(0, k).toFixed(3)})`;
  sayEl.style.opacity = sayT > 0 ? 1 : 0;
}

function makeCat(face) {
  const FUR = '#e8913f', FAR = '#c06c2a', LINE = '#5a2f12', STRIPE = '#b65a1e', PINK = '#f29aa0';
  const g = el('g', {}, guestsG);
  g.style.display = 'none';
  const side = el('g', {}, g), rear = el('g', {}, g), hd = el('g', {}, g);
  const round = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  const limb = (p, c, w = 13) => [el('path', { ...round, stroke: LINE, 'stroke-width': w + 8 }, p), el('path', { ...round, stroke: c, 'stroke-width': w }, p)];
  const tailOf = p => [...limb(p, FUR, 14), el('path', { fill: 'none', stroke: STRIPE, 'stroke-width': 14, 'stroke-dasharray': '7 12' }, p)];
  const setD = (L, d) => { for (const e of L) e.setAttribute('d', d); };
  const blob = (p, shapes) => { for (const [c, w] of [[LINE, 8], [FUR, 0]]) for (const [tag, a] of shapes) el(tag, { ...a, fill: c, stroke: c, 'stroke-width': w }, p); };

  // side view (faces +x, paws on y=0), the bubble butt trailing behind
  const sb = el('g', {}, side);
  const leg = (x, y, o, k, c) => ({ x, y, o, k, L: limb(sb, c) });
  const legs = [leg(-62, -64, Math.PI, -9, FAR), leg(40, -72, 0, 3, FAR)];
  const sTail = tailOf(sb);
  blob(sb, [['circle', { cx: -56, cy: -84, r: 52 }], ['ellipse', { cx: 4, cy: -86, rx: 64, ry: 30 }], ['circle', { cx: 52, cy: -92, r: 30 }]]);
  el('path', { d: 'M-6 -114q5 10 0 20M16 -115q5 10 0 20M38 -111q4 9 0 17M-66 -130q17 8 16 27M-90 -114q14 8 14 24', ...round, stroke: STRIPE, 'stroke-width': 6 }, sb);
  el('ellipse', { cx: -76, cy: -112, rx: 17, ry: 9, transform: 'rotate(-35 -76 -112)', fill: '#fff', opacity: 0.35 }, sb);
  legs.push(leg(-44, -64, 0, -9, FUR), leg(58, -72, Math.PI, 3, FUR));

  // rear view, for the show: two big cheeks
  const rb = el('g', {}, rear);
  for (const s of [-1, 1]) setD(limb(rb, FUR), `M${s * 46} -44L${s * 50} -10`);
  blob(rb, [['ellipse', { cx: 0, cy: -116, rx: 48, ry: 46 }]]);
  el('path', { d: 'M-30 -142q30 -8 60 0M-38 -124q38 -9 76 0', ...round, stroke: STRIPE, 'stroke-width': 6 }, rb);
  const cheeks = [-1, 1].map(s => {
    const ch = el('g', {}, rb);
    el('circle', { cx: s * 37, cy: -64, r: 46, fill: FUR, stroke: LINE, 'stroke-width': 5 }, ch);
    el('ellipse', { cx: s * 37 - 14, cy: -86, rx: 13, ry: 8, transform: `rotate(-25 ${s * 37 - 14} -86)`, fill: '#fff', opacity: 0.4 }, ch);
    return ch;
  });
  const rTail = tailOf(rb);

  // head: ears, face slot, whiskers
  for (const s of [-1, 1]) {
    el('path', { d: `M${s * 50} -20L${s * 44} -90L${s * 6} -58Z`, fill: FUR, stroke: LINE, 'stroke-width': 5, 'stroke-linejoin': 'round' }, hd);
    el('path', { d: `M${s * 41} -36L${s * 39} -76L${s * 18} -58Z`, fill: PINK }, hd);
  }
  faceHead(hd, face, 52, FUR, LINE);
  el('path', { d: 'M-48 10L-84 2M-48 18L-86 20M-48 26L-82 36M48 10L84 2M48 18L86 20M48 26L82 36', ...round, stroke: '#f3ece0', 'stroke-width': 3 }, hd);

  // modes: away → walk ⇄ idle → (walk to a spot → show) → exit → away
  const c = { x: 0, y: GROUND - 2, dir: 1, mode: 'away', pose: 'side', tx: 0, ph: 0, amp: 0, until: 0, leave: 0, meowAt: 0,
              traki: false, show: false, said: false, sT: 0, tw: 0, turn: 0, mid: null, hx: 0, hy: 0 };
  const setPose = p => { c.pose = p; side.style.display = p === 'side' ? '' : 'none'; rear.style.display = p === 'rear' ? '' : 'none'; };
  const turn = fn => { c.turn = 0.26; c.mid = fn; };   // squash to nothing, flip at the midpoint, stretch back
  const go = tx => { c.tx = tx; c.mode = 'walk'; };
  const exit = (out = Math.random() < 0.5 ? -1 : 1) => { c.mode = 'exit'; c.show = false; c.tx = c.x + out * 1e5; };
  function wander() {
    if (T < c.leave) { const [lo, hi] = ROAM; let tx; do tx = rand(lo, hi); while (Math.abs(tx - c.x) < 220); go(tx); }
    else if (c.traki) { c.traki = false; c.show = true; go(960 + (c.x < 960 ? -1 : 1) * rand(260, 420)); }
    else exit();
  }
  function arrive() {
    if (c.show) { c.mode = 'show'; c.sT = 0; c.said = false; turn(() => setPose('rear')); return; }
    if (T > c.leave) return wander();
    c.mode = 'idle'; c.until = T + rand(2.5, 7);
    if (Math.random() < 0.6) c.meowAt = Math.min(c.meowAt, T + rand(0.3, 1.5));
  }
  setPose('side');

  c.enter = (traki = Math.random() < TRAKI_CHANCE, stay = rand(...VISIT)) => {
    const fromL = Math.random() < 0.5, [lo, hi] = ROAM;
    c.dir = fromL ? 1 : -1; c.x = fromL ? -170 : 2090; c.ph = c.amp = c.turn = 0;
    c.traki = traki; c.show = false; c.leave = T + stay; c.meowAt = T + rand(4, 8);
    setPose('side'); go(lerp(lo, hi, fromL ? rand(0.15, 0.4) : rand(0.6, 0.85)));
    g.style.display = '';
  };
  c.shoo = () => { if (c.mode === 'walk' || c.mode === 'idle') exit(); };
  c.meow = () => say(c, 'მიაუ მიაუ', 2.2);
  c.top = () => ({ x: c.x + c.hx, y: c.y + c.hy - 98 });
  c.update = dt => {
    if (c.mode === 'away') return false;
    let moved = 0;
    if (c.turn > 0) { const was = c.turn; c.turn -= dt; if (was > 0.13 && c.turn <= 0.13) c.mid(); }
    else if (c.mode === 'walk' || c.mode === 'exit') {
      const want = Math.sign(c.tx - c.x) || c.dir;
      if (want !== c.dir) turn(() => { c.dir = want; });
      else {
        moved = Math.min(Math.abs(c.tx - c.x), (c.mode === 'exit' ? 170 : 115) * dt);
        c.x += c.dir * moved; c.ph += moved / 20;
        if (c.mode === 'walk' && Math.abs(c.tx - c.x) < 0.5) arrive();
      }
    } else if (c.mode === 'idle') { if (T > c.until) wander(); }
    else if (c.mode === 'show') {
      c.sT += dt;
      if (c.sT > 0.35 && !c.said) { c.said = true; say(c, 'ტრაკიიიი', 3.6, true); }
      if (c.tw > 0.4) emitN(7 * dt, () => add({ k: 'heart', x: c.x + rand(-70, 70), y: c.y - rand(60, 110), vx: rand(-40, 40), vy: rand(-110, -60), r: rand(8, 13), ph: rand(0, 6), max: rand(1.2, 1.8) }));
      if (c.sT > 4.4) { const out = Math.random() < 0.5 ? -1 : 1; turn(() => { setPose('side'); c.dir = out; }); exit(out); }
    }
    if (c.mode === 'exit') {
      if ((c.x < -260 && c.dir < 0) || (c.x > 2180 && c.dir > 0)) { c.mode = 'away'; g.style.display = 'none'; return false; }
    }
    if (T > c.meowAt && c.pose === 'side' && c.mode !== 'show') { c.meow(); c.meowAt = T + rand(8, 20); }

      sb.setAttribute('transform', `translate(0 ${f(bob)})`);
      for (const l of legs) {   // trot: diagonal pairs swing together

      }
      const sw = Math.sin(T * 2.3) * 10 + Math.sin(c.ph * 2) * 4 * c.amp;
      setD(sTail, `M-98 -104C-130 -108 ${f(-144 + sw * 0.4)} -146 ${f(-122 + sw)} -192`);

      const k = c.tw, b = Math.sin(T * 17) * k;   // twerk: the cheeks bounce in turn, the hips sway
      rear.setAttribute('transform', `scale(${sx.toFixed(3)} 1)`);
      cheeks[0].setAttribute('transform', `translate(0 ${f(b * 10)})`);
      cheeks[1].setAttribute('transform', `translate(0 ${f(-b * 10)})`);
      rb.setAttribute('transform', `translate(${f(Math.sin(T * 8.5) * 7 * k)} ${f(-Math.abs(b) * 4)}) rotate(${f(b * 4)} 0 -60)`);
      const w = Math.sin(T * 9) * (8 + 14 * k);
      setD(rTail, `M0 -100C8 -140 ${f(58 + w)} -132 ${f(64 + w * 1.3)} -176`);
      c.hx = -40 * sx; c.hy = -192 - Math.abs(b) * 4; rot = (-8 + b * 3) * c.dir;   // looks back over the shoulder
    }
    hd.setAttribute('transform', `translate(${f(c.hx)} ${f(c.hy)}) rotate(${f(rot)}) scale(${sq.toFixed(3)} 1)`);
  }
  return c;
}

const CAT = makeCat({ src: NIKO, zoom: 1.45, fx: 0.51, fy: 0.41 }), GUESTS = [CAT];
let guest = null, nextGuest = rand(30, 90);
function updateGuests(dt, rem) {
  const quiet = rem < 600000 && rem > -60000;   // the last 10 min and the collapse belong to the hero
  if (guest) {
    if (quiet && rem < 90000) guest.shoo();
    if (!guest.update(dt)) { guest = null; nextGuest = T + rand(...AWAY); }
  } else if (T > nextGuest && !quiet) (guest = pick(GUESTS)).enter();
  updateSay(dt);
}
function summon(traki) {
  if (!guest) { guest = CAT; CAT.enter(traki || Math.random() < TRAKI_CHANCE, traki ? 0 : rand(...VISIT)); }
  else if (guest === CAT) { if (traki) { CAT.traki = true; CAT.leave = 0; } else CAT.meow(); }
}

// ───────────────────────── countdown
let lastStr = '', lastSec = -1, lastCol = '', lastBlink = null;
function updateCountdown(rem) {
  let s = Math.max(0, Math.ceil(rem / 1000));
  const sec = s;
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  const str = [d, h, m, s].map(v => String(v).padStart(2, '0')).join('');
  if (str !== lastStr) { for (let i = 0; i < 8; i++) if (str[i] !== lastStr[i]) DIG[i].textContent = str[i]; lastStr = str; }
  const dead = rem <= 0;
  cdEl.classList.toggle('dead', dead);
  if (!dead && rem < 60000 && sec !== lastSec) { cdEl.classList.remove('beat'); void cdEl.offsetWidth; cdEl.classList.add('beat'); }
  lastSec = sec;
  const ca = dead ? rgb('#ff2b2b') : D < 0.5 ? mixA('#dfe8ff', '#ffb347', D * 2) : mixA('#ffb347', '#ff3030', (D - 0.5) * 2);
  const col = ca.join(',');
  if (col !== lastCol) { lastCol = col; cdEl.style.setProperty('--c', `rgb(${col})`); cdEl.style.setProperty('--g', `rgba(${col},0.6)`); }
  const blink = dead || (((now() % 1000) + 1000) % 1000) < 500;
  if (blink !== lastBlink) { lastBlink = blink; SEPS.forEach(b => b.style.opacity = blink ? 1 : 0.3); }
}

// ───────────────────────── stage shake / glitch / flash
function applyStage(dt) {
  shakeMag *= Math.exp(-dt * 5); if (shakeMag < 0.05) shakeMag = 0;
  let sx = rand(-1, 1) * shakeMag, sy = rand(-1, 1) * shakeMag;
  if (glitchT > 0) {
    glitchT -= dt; sx += rand(-24, 24);
    if (!LITE) stage.style.filter = glitchT > 0 ? `hue-rotate(${Math.round(rand(-120, 120))}deg) saturate(2.2) contrast(1.25)` : '';
  }
  stage.style.transform = `translate(${(fitX + sx * fitS).toFixed(2)}px,${(fitY + sy * fitS).toFixed(2)}px) scale(${fitS})`;
  flashA *= Math.exp(-dt * 7); if (flashA < 0.005) flashA = 0;
  flashEl.style.opacity = flashA.toFixed(3);
}

// ───────────────────────── main loop
function step(dt) {
  T += dt;
  const n = now(), rem = TARGET - n;
  if (rem <= 0 && state === 'calm') startCollapse();
  else if (rem > 0 && state !== 'calm') resetCalm();
  const dT = state === 'calm' ? danger(n) : 1;
  D += (dT - D) * Math.min(1, dt * 1.5);
  updateEnv(dt);
  if (state === 'calm') { updateCalm(dt); updateDrops(dt); } else updateCollapse(dt);
  updateGuests(dt, rem);
  updateFx(dt);
  return rem;
}

D = danger(now());
if (TARGET - now() <= 0) {
  // Already past zero on load: fast-forward straight into the aftermath.
  D = 1; startCollapse();
  for (let i = 0; i < 720; i++) step(1 / 60);
  P.length = 0; shakeMag = flashA = glitchT = ghostT = 0; nextGlitch = cT + 4;
} else step(0);   // pose everything before the first paint
updateCountdown(TARGET - now());

let last = performance.now();
const MIN_MS = LITE ? 1000 / 30 - 2 : 0;   // lite: ~30fps
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - last < MIN_MS) return;
  if (innerWidth !== fitW || innerHeight !== fitH) fit();
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  const rem = step(dt);
  updateCountdown(rem);
  drawFx();
  applyStage(dt);
}
requestAnimationFrame(frame);
// test hook: simulate N seconds instantly (used for previews)
window.__ff = secs => { for (let i = 0, n = Math.round(secs * 60); i < n; i++) { timeOffset += 1000 / 60; step(1 / 60); applyStage(1 / 60); } updateCountdown(TARGET - now()); drawFx(); };

// ───────────────────────── controls, fullscreen, keep screen awake
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') { dOverride = +e.key / 9; timeOffset = 0; }
  else if (e.key === 'z') { dOverride = null; timeOffset = TARGET - 10500 - Date.now(); }
  else if (e.key === 'r') { dOverride = null; timeOffset = 0; }
  else if (e.key === 'f') toggleFS();
  else if (e.key === 'c') summon(false);
  else if (e.key === 't') summon(true);
});
addEventListener('dblclick', toggleFS);
async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {} }
wake();
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
addEventListener('click', wake);
})();
